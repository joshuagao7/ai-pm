<title>AI PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --grid:rgba(0,0,0,.045); --panel:#FFFFFF;
    --ink:#0A0A0C; --muted:rgba(10,10,12,.45);
    --line:rgba(0,0,0,.12); --line-strong:rgba(0,0,0,.28);
    --accent:#C45C26; --accent-ink:#FFFFFF; --accent-soft:rgba(196,92,38,.09);
    --drop:rgba(196,92,38,.14);
    --prime:#0A0A0C; --prime-ink:#FFFFFF;
    --edge:rgba(10,10,12,.30); --edge-faded:rgba(10,10,12,.08);
    --ax1:#B85C8A; --ax2:#5B8DBE; --ax3:#7A8F3C; --ax4:#A2653C; --ax5:#4E9E96; --ax6:#8E5AA8;
    --ax7:#C4523F; --ax8:#6A5FB5; --ax9:#A87E24; --ax10:#3E8A62;
    --st-basic:#B4485C; --st-perf:#0E7490; --st-del:#C08A1F; --st-ind:#77808B; --st-rnd:#3D66C4;
    --st-basic-soft:rgba(180,72,92,.07); --st-perf-soft:rgba(14,116,144,.06);
    --st-del-soft:rgba(192,138,31,.08); --st-ind-soft:rgba(119,128,139,.09); --st-rnd-soft:rgba(61,102,196,.07);
    --o-para:#7C3AED; --o-ai:#15803D; --o-ai-soft:rgba(21,128,61,.08);
    --shadow:0 1px 2px rgba(0,0,0,.05);
    --f-head:'Aldrich','Avenir Next Condensed',system-ui,sans-serif;
    --f-mono:'Space Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1E1E24; --grid:rgba(255,255,255,.05); --panel:#26262E;
      --ink:#ECECF1; --muted:rgba(236,236,241,.48);
      --line:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.32);
      --accent:#E0703A; --accent-ink:#16161A; --accent-soft:rgba(224,112,58,.14);
      --drop:rgba(224,112,58,.20);
      --prime:#ECECF1; --prime-ink:#16161A;
      --edge:rgba(236,236,241,.32); --edge-faded:rgba(236,236,241,.08);
      --ax1:#D687AC; --ax2:#83AFD6; --ax3:#A3B86A; --ax4:#C98F66; --ax5:#7CC2BB; --ax6:#B287CC;
      --ax7:#E0705C; --ax8:#9A8FE0; --ax9:#CFA653; --ax10:#63B389;
      --st-basic:#D06A7D; --st-perf:#2FAECB; --st-del:#D6A245; --st-ind:#8D97A3; --st-rnd:#84A3E6;
      --st-basic-soft:rgba(208,106,125,.13); --st-perf-soft:rgba(47,174,203,.11);
      --st-del-soft:rgba(214,162,69,.12); --st-ind-soft:rgba(141,151,163,.12); --st-rnd-soft:rgba(132,163,230,.13);
      --o-para:#B695F0; --o-ai:#5FC98A; --o-ai-soft:rgba(95,201,138,.12);
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#FFFFFF; --grid:rgba(0,0,0,.045); --panel:#FFFFFF;
    --ink:#0A0A0C; --muted:rgba(10,10,12,.45);
    --line:rgba(0,0,0,.12); --line-strong:rgba(0,0,0,.28);
    --accent:#C45C26; --accent-ink:#FFFFFF; --accent-soft:rgba(196,92,38,.09);
    --drop:rgba(196,92,38,.14);
    --prime:#0A0A0C; --prime-ink:#FFFFFF;
    --edge:rgba(10,10,12,.30); --edge-faded:rgba(10,10,12,.08);
    --ax1:#B85C8A; --ax2:#5B8DBE; --ax3:#7A8F3C; --ax4:#A2653C; --ax5:#4E9E96; --ax6:#8E5AA8;
    --ax7:#C4523F; --ax8:#6A5FB5; --ax9:#A87E24; --ax10:#3E8A62;
    --st-basic:#B4485C; --st-perf:#0E7490; --st-del:#C08A1F; --st-ind:#77808B; --st-rnd:#3D66C4;
    --st-basic-soft:rgba(180,72,92,.07); --st-perf-soft:rgba(14,116,144,.06);
    --st-del-soft:rgba(192,138,31,.08); --st-ind-soft:rgba(119,128,139,.09); --st-rnd-soft:rgba(61,102,196,.07);
    --o-para:#7C3AED; --o-ai:#15803D; --o-ai-soft:rgba(21,128,61,.08);
    --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  :root[data-theme="dark"]{
    --bg:#1E1E24; --grid:rgba(255,255,255,.05); --panel:#26262E;
    --ink:#ECECF1; --muted:rgba(236,236,241,.48);
    --line:rgba(255,255,255,.14); --line-strong:rgba(255,255,255,.32);
    --accent:#E0703A; --accent-ink:#16161A; --accent-soft:rgba(224,112,58,.14);
    --drop:rgba(224,112,58,.20);
    --prime:#ECECF1; --prime-ink:#16161A;
    --edge:rgba(236,236,241,.32); --edge-faded:rgba(236,236,241,.08);
    --ax1:#D687AC; --ax2:#83AFD6; --ax3:#A3B86A; --ax4:#C98F66; --ax5:#7CC2BB; --ax6:#B287CC;
    --ax7:#E0705C; --ax8:#9A8FE0; --ax9:#CFA653; --ax10:#63B389;
    --st-basic:#D06A7D; --st-perf:#2FAECB; --st-del:#D6A245; --st-ind:#8D97A3; --st-rnd:#84A3E6;
    --st-basic-soft:rgba(208,106,125,.13); --st-perf-soft:rgba(47,174,203,.11);
    --st-del-soft:rgba(214,162,69,.12); --st-ind-soft:rgba(141,151,163,.12); --st-rnd-soft:rgba(132,163,230,.13);
    --o-para:#B695F0; --o-ai:#5FC98A; --o-ai-soft:rgba(95,201,138,.12);
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    font:12px/1.5 var(--f-mono);
    display:flex; flex-direction:column;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
  .btn:disabled{opacity:.35; pointer-events:none}

  header{
    flex:0 0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--bg); z-index:20;
  }
  .brand h1{
    margin:0; font:15px/1.1 var(--f-head); letter-spacing:.06em; text-transform:uppercase;
  }
  .brand .sub{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; letter-spacing:.02em}
  .chips{display:flex; gap:4px; flex-wrap:wrap}
  .chip{
    display:flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
    border:1px solid var(--line); font-size:10px; letter-spacing:.04em; background:var(--panel);
  }
  .chip .dot{width:7px; height:7px; border-radius:50%}
  .chip .n{color:var(--muted); font-size:10px; font-variant-numeric:tabular-nums}
  .chip.off{opacity:.35}
  .chip:hover{border-color:var(--line-strong)}
  .spacer{flex:1}
  .search{
    padding:5px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font:inherit; font-size:11px; width:150px;
  }
  .search::placeholder{color:var(--muted)}
  .btn{
    padding:5px 14px; border-radius:9px; border:1px solid var(--line-strong);
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; background:var(--panel);
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.primary{background:var(--prime); color:var(--prime-ink); border-color:var(--prime)}
  .btn.primary:hover{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.exec{background:#C42B2B; border-color:#C42B2B; color:#fff}
  .btn.exec:hover{background:#A32020; border-color:#A32020; color:#fff}
  #recpill{
    position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:60;
    background:#C42B2B; color:#fff; font:700 11px/1 var(--f-mono); letter-spacing:.06em;
    padding:9px 16px; border-radius:999px; display:none; align-items:center; gap:9px;
    max-width:min(70vw,560px);
  }
  #recpill.on{display:flex}
  #recpill .rdot{width:8px; height:8px; border-radius:50%; background:#fff; flex:0 0 auto; animation:recblink 1s infinite}
  #recpill #rectext{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:400}
  @keyframes recblink{50%{opacity:.2}}
  @media (prefers-reduced-motion: reduce){ #recpill .rdot{animation:none} }
  #sprintmon{
    position:fixed; right:14px; bottom:14px; z-index:30; width:360px; max-height:45vh; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line-strong); border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.25); padding:10px 12px; display:none; flex-direction:column; gap:7px;
  }
  #sprintmon.on{display:flex}
  #sprintmon .smh{font:12px/1.2 var(--f-head); letter-spacing:.09em; text-transform:uppercase; display:flex; align-items:center; gap:8px}
  #sprintmon .smh .st{margin-left:auto; font:400 9.5px var(--f-mono); color:var(--muted); text-transform:none; letter-spacing:.02em}
  .smrow{display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line); padding-top:6px}
  .smrow .t{display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700}
  .smrow .t .ago{margin-left:auto; font-size:9px; color:var(--muted); font-weight:400; font-variant-numeric:tabular-nums}
  .smrow .dot{width:8px; height:8px; border-radius:50%; background:var(--st-del); flex:0 0 auto; animation:recblink 1.2s infinite}
  .smrow.done .dot{background:var(--o-ai); animation:none}
  .smrow.stale .dot{background:var(--st-basic); animation:none}
  .smrow .last{font-size:10px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:15px}
  .smrow.done{cursor:pointer}
  .smrow.done:hover .t{color:var(--o-ai)}
  @media (prefers-reduced-motion: reduce){ .smrow .dot{animation:none} }
  #saveState{font-size:10px; color:var(--muted); min-width:64px; text-align:right; font-variant-numeric:tabular-nums; letter-spacing:.04em}
  #saveState.err{color:var(--st-basic)}
  .selhint{font-size:10px; color:var(--muted); letter-spacing:.02em}
  .selhint b{color:var(--accent); font-weight:700}

  /* canvas */
  #viewport{
    flex:1 1 auto; overflow:hidden; position:relative; min-height:0; cursor:grab; touch-action:none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:64px 64px;
  }
  #viewport.panning{cursor:grabbing}
  #world{position:absolute; top:0; left:0; transform-origin:0 0}
  .lanehead{
    position:absolute; display:flex; align-items:center; gap:8px; height:30px; z-index:3;
  }
  .lanehead .t{font:12px/1.1 var(--f-head); letter-spacing:.1em; text-transform:uppercase}
  .lanehead .n{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums}
  .lanehead.center .t{color:var(--accent)}
  .lanehead .add{
    font-size:13px; color:var(--muted); border:1px dashed var(--line-strong);
    border-radius:7px; padding:0 8px; line-height:20px; margin-left:auto;
  }
  .lanehead .add:hover{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
  .lanebg{position:absolute; border-radius:16px; pointer-events:none; z-index:0}
  .lanebg.hot{outline:2px dashed var(--accent); outline-offset:-2px; background:var(--drop)}
  .groupbox{
    position:absolute; z-index:1; pointer-events:none;
    background:var(--accent-soft); border:1px dashed var(--line-strong); border-radius:14px;
  }
  .groupbox .gl{
    position:absolute; top:4px; left:12px; right:12px; font-size:9px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  #edgesvg{position:absolute; inset:0; z-index:1; pointer-events:none; transition:opacity .22s ease}
  #edgesvg.moving{opacity:.12}
  .groupbox{animation:gbfade .5s ease}
  @keyframes gbfade{from{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    #edgesvg{transition:none}
    .groupbox{animation:none}
  }
  #edgesvg path.vis{fill:none; stroke:var(--edge); stroke-width:1.4}
  #edgesvg g.sel path.vis{stroke:var(--accent); stroke-width:2.6}
  #edgesvg g.hl path.vis{stroke:var(--accent); stroke-width:2.2}
  #edgesvg g.faded path.vis{stroke:var(--edge-faded)}
  #edgesvg path.hit{fill:none; stroke:transparent; stroke-width:14; pointer-events:stroke; cursor:pointer}
  #edgesvg path.temp{fill:none; stroke:var(--accent); stroke-width:2; stroke-dasharray:6 5}
  #edgesvg g.sugg path.vis{stroke:var(--o-ai); stroke-width:1.8; stroke-dasharray:5 5}
  #edgesvg g.sugg:hover path.vis{stroke-width:2.6}
  #edgesvg g.sugg.armed path.vis{stroke:var(--edge); stroke-width:2.4; stroke-dasharray:none}

  .card{
    position:absolute; width:300px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:7px 10px 7px 12px; box-shadow:var(--shadow); z-index:2;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  .card::before{
    content:""; position:absolute; left:0; top:9px; bottom:9px; width:3px; border-radius:3px;
    background:var(--stripe, var(--a-color,var(--line-strong)));
  }
  .card .meta{display:flex; align-items:center; gap:6px; margin-bottom:2px; min-height:15px}
  .card .cid{font:700 9.5px/1 var(--f-mono); color:var(--a-color,var(--muted)); letter-spacing:.05em}
  .card .aname{font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--a-color,var(--muted))}
  .card .kind{font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line-strong); border-radius:5px; padding:0 4px}
  .card .inn{font-size:9.5px; color:var(--muted); font-variant-numeric:tabular-nums}
  .card .title{font-size:11px; line-height:1.5; border-radius:4px; padding:1px 2px; outline:none; cursor:default}
  .card.editable .title{cursor:text}
  .card .title[contenteditable="true"]{background:var(--accent-soft); cursor:text}
  .card .title.o-para, .card .notes.o-para{color:var(--o-para)}
  .card .title.o-ai, .card .notes.o-ai{color:var(--o-ai)}
  .obtn{width:9px; height:9px; border-radius:50%; border:1px solid var(--line-strong); flex:0 0 auto}
  .obtn.o-raw{background:var(--ink)}
  .obtn.o-para{background:var(--o-para); border-color:var(--o-para)}
  .obtn.o-ai{background:var(--o-ai); border-color:var(--o-ai)}
  .legend .chip{cursor:default; border-style:dashed}
  .card .notes{
    width:100%; margin-top:6px; font:10.5px/1.5 var(--f-mono); color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; resize:vertical; min-height:48px;
  }
  .fu{margin-top:6px}
  .fulabel{display:flex; align-items:center; font-size:8.5px; font-weight:700; letter-spacing:.09em; color:var(--accent); margin-bottom:2px}
  .fux{margin-left:auto; font-size:9px; color:var(--muted); padding:1px 5px; border-radius:5px}
  .fux:hover{color:var(--st-basic)}
  .card .notes.futext{border-left:3px solid var(--accent); margin-top:0; min-height:38px}
  .card .foot{display:flex; gap:8px; margin-top:4px}
  .card .foot button{font-size:9.5px; color:var(--muted); letter-spacing:.04em}
  .card .foot button:hover{color:var(--accent)}
  .card .port{
    position:absolute; right:-8px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; border-radius:50%; background:var(--panel);
    border:2px solid var(--line-strong); cursor:crosshair; z-index:3;
  }
  .card .port:hover{border-color:var(--accent); background:var(--accent-soft)}
  .card .del{
    position:absolute; top:-7px; right:-7px; width:18px; height:18px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line-strong); font-size:9px; color:var(--muted);
    display:none; align-items:center; justify-content:center; z-index:3;
  }
  .card:hover .del{display:flex}
  .card .del:hover{color:var(--st-basic); border-color:var(--st-basic)}
  .card.snaptgt{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), 0 0 14px var(--accent-soft), var(--shadow); transform:scale(1.015)}
  .card.selected{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
  .card.selected .meta::after{content:"✓"; margin-left:auto; font-size:11px; font-weight:700; color:var(--accent)}
  .card.faded{opacity:.18}
  .card.dimmed{opacity:.14}
  .card.hidden{display:none}
  .card.linked .cid::before{content:"✓ "; color:var(--o-ai); font-weight:700}
  .card.st-indiff{opacity:.55}
  .rankb{font:700 10px/1 var(--f-mono); background:var(--accent); color:var(--accent-ink); border-radius:6px; padding:3px 6px; letter-spacing:.05em}
  .rk{font-size:9px; color:var(--muted); padding:2px 4px; border-radius:5px; line-height:1}
  .rk:hover{color:var(--accent); background:var(--accent-soft)}
  .flagbtn{font-size:11px; color:var(--muted); padding:2px 5px; border-radius:5px; line-height:1}
  .flagbtn:hover{color:var(--o-ai); background:var(--o-ai-soft)}
  .flagbtn.on{color:#fff; background:var(--o-ai)}
  .card.done{--stripe:var(--o-ai); background:var(--o-ai-soft); opacity:.75}
  .card.done .title{text-decoration:line-through; text-decoration-color:var(--o-ai); text-decoration-thickness:1px}
  .card.dragging{z-index:5; box-shadow:0 8px 28px rgba(0,0,0,.25)}
  .card.st-basic{--stripe:var(--st-basic); background:var(--st-basic-soft)}
  .card.st-perf{--stripe:var(--st-perf); background:var(--st-perf-soft)}
  .card.st-delight{--stripe:var(--st-del); background:var(--st-del-soft)}
  .card.st-indiff{--stripe:var(--st-ind); background:var(--st-ind-soft)}
  .card.st-rnd{--stripe:var(--st-rnd); background:var(--st-rnd-soft)}

  .stchip{
    margin-left:auto; font-size:8.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    border-radius:999px; padding:1px 7px; color:#fff; line-height:14px;
  }
  .tagbar{
    position:absolute; left:2px; right:2px; bottom:2px; height:30px; z-index:6;
    display:none; gap:2px;
  }
  .card.seed:hover .tagbar{display:flex}
  .tagbar button{
    flex:1; border-radius:8px; font-size:9.5px; font-weight:700; letter-spacing:.05em;
    text-transform:uppercase; color:#fff;
  }
  .tagbar button:hover{filter:brightness(1.12)}
  .tagbar button.active{outline:2px solid var(--ink); outline-offset:-2px}

  #edgedel{
    position:absolute; z-index:6; width:20px; height:20px; border-radius:50%;
    background:var(--panel); border:1px solid var(--st-basic); color:var(--st-basic);
    font-size:10px; display:none; align-items:center; justify-content:center;
  }
  #edgedel.open{display:flex}

  .overlay{position:fixed; inset:0; background:rgba(10,10,12,.5); display:none; align-items:center; justify-content:center; padding:24px; z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--panel); border:1px solid var(--line-strong); border-radius:14px; width:min(780px,100%); max-height:86vh; display:flex; flex-direction:column; box-shadow:0 12px 48px rgba(0,0,0,.35)}
  .modal-head{display:flex; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line)}
  .modal-head .t{font:13px/1.2 var(--f-head); letter-spacing:.06em; text-transform:uppercase}
  .modal-head .x{margin-left:auto; color:var(--muted); padding:4px 8px; border-radius:7px}
  .modal-head .x:hover{background:var(--accent-soft); color:var(--accent)}
  .modal textarea{flex:1; margin:14px 16px; min-height:340px; resize:vertical; font:11px/1.55 var(--f-mono); background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px}
  .modal-foot{display:flex; gap:10px; padding:0 16px 16px; justify-content:flex-end; align-items:center}
  .modal-foot .note{margin-right:auto; font-size:11px; color:var(--muted)}

  /* upload panel */
  .upbody{display:flex; flex-direction:column; gap:10px; padding:14px 16px 16px; overflow-y:auto}
  .upbody .row{display:flex; align-items:center; gap:8px; font-size:11px; letter-spacing:.04em; text-transform:uppercase}
  .upbody .row input{flex:1; padding:6px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink); font:11px/1.4 var(--f-mono); text-transform:none; letter-spacing:0}
  #upText{margin:0; min-height:130px}

<script>
'use strict';
/* ---------------- constants ---------------- */
const LANE_W = 300, GAPX = 120, GAPY = 12, LANE_X0 = 40;
/* Author colors are assigned in first-appearance order from a 10-color palette. */
const AUTHOR_COLORS = 10;
function authorVar(name) {
  const authors = [...new Set(board.cards.filter(isSeed).map((c) => c.author))].filter(Boolean);
  return `var(--ax${(Math.max(0, authors.indexOf(name)) % AUTHOR_COLORS) + 1})`;
}
const STATUS = {
  basic:   {label:'Basic',       css:'var(--st-basic)', key:'1', desc:'Expected — absence enrages'},
  perf:    {label:'Performance', css:'var(--st-perf)',  key:'2', desc:'More is linearly better'},
  delight: {label:'Delighter',   css:'var(--st-del)',   key:'3', desc:'Unexpected — differentiates'},
  indiff:  {label:'Indifferent', css:'var(--st-ind)',   key:'4', desc:'Nobody would notice — skip candidate'},
  rnd:     {label:'R&D',         css:'var(--st-rnd)',   key:'5', desc:'Worth doing — needs research & development, longer horizon'},
};

/* ---------------- state & sync ---------------- */
let board = null;            // {sprint, stages, uid, cards, edges}
let lastMtime = 0;
let dirty = false, saveTimer = null, interacting = false;
let sel = new Set();         // selected card ids
let selEdge = null;          // selected edge id
let authorFilter = new Set();
const authorSeen = new Set();
let statusFilter = new Set(['none', ...Object.keys(STATUS)]);
let query = '';

const $ = (id) => document.getElementById(id);
const byId = (id) => board.cards.find((c) => c.id === id);
const stageIdx = (sid) => board.stages.findIndex((s) => s.id === sid);
const COLGAP = 18;
let seedCols = 1; // sub-columns in the comments lane, computed each layout
const laneW = (i) => (i === 0 ? seedCols * LANE_W + (seedCols - 1) * COLGAP : LANE_W);
const laneX = (i) => (i === 0 ? LANE_X0 : LANE_X0 + laneW(0) + GAPX + (i - 1) * (LANE_W + GAPX));
const worldW = () => laneX(board.stages.length - 1) + LANE_W + LANE_X0;
const laneAtX = (x) => {
  for (let i = 0; i < board.stages.length; i++) {
    if (x >= laneX(i) - GAPX / 2 && x <= laneX(i) + laneW(i) + GAPX / 2) return i;
  }
  return -1;
};
const insideLane = (x) => {
  const i = laneAtX(x);
  return i >= 0 && x >= laneX(i) && x <= laneX(i) + laneW(i) ? i : -1;
};
const seedStage = () => board.stages[0].id;
const isSeed = (c) => c.stage === seedStage();

function sanitize() {
  const legacy = { disagree: 'indiff' };
  for (const c of board.cards) {
    if (!c.status) continue;
    if (legacy[c.status]) c.status = legacy[c.status];
    else if (!STATUS[c.status]) delete c.status;
  }
}
async function loadState() {
  const r = await fetch('/api/state');
  const j = await r.json();
  board = j.data; lastMtime = j.mtimeMs;
  sanitize();
  document.title = `${board.sprint} — AI PM`;
  $('title').textContent = `AI PM · ${board.sprint}`;
  render(); fitView(); setSave('Saved');
}
function setSave(t, err) { const el = $('saveState'); el.textContent = t; el.classList.toggle('err', !!err); }

/* ---------------- undo / redo ---------------- */
const undoStack = [], redoStack = [];
function snapshot() {
  undoStack.push(JSON.stringify(board));
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  updateUndoBtn();
}
function restoreState(json) {
  board = JSON.parse(json);
  sel = new Set([...sel].filter((id) => byId(id)));
  selEdge = null;
  touch(); render(); updateUndoBtn();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(board));
  restoreState(undoStack.pop());
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(board));
  restoreState(redoStack.pop());
}
function updateUndoBtn() { $('undoBtn').disabled = !undoStack.length; }
$('undoBtn').addEventListener('click', undo);
function touch() {
  dirty = true; setSave('Editing…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 700);
}
async function saveNow() {
  if (!dirty) return;
  try {
    const r = await fetch('/api/state', { method:'POST', body: JSON.stringify(board) });
    const j = await r.json();
    if (j.ok) { dirty = false; lastMtime = j.mtimeMs; setSave('Saved'); }
    else setSave('Save failed', true);
  } catch (e) { setSave('Server offline', true); }
}
setInterval(async () => {
  if (dirty || interacting || !board) return;
  try {
    const j = await (await fetch('/api/mtime')).json();
    if (j.mtimeMs > lastMtime + 1) {
      const s = await (await fetch('/api/state')).json();
      board = s.data; lastMtime = s.mtimeMs;
      sanitize();
      undoStack.length = 0; redoStack.length = 0; updateUndoBtn();
      sel = new Set([...sel].filter((id) => byId(id)));
      render(); setSave('Synced ↓');
    }
  } catch (e) {}
}, 3000);
window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && dirty) {
    fetch('/api/state', { method:'POST', body: JSON.stringify(board), keepalive:true });
    dirty = false;
  }
});

/* ---------------- canvas view: pan + zoom ---------------- */
const view = { x: 24, y: 24, z: 0.9 };
function applyView() {
  $('world').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
}
function zoomAt(cx, cy, f) {
  const r = $('viewport').getBoundingClientRect();
  const z2 = Math.min(2.5, Math.max(0.12, view.z * f));
  const k = z2 / view.z;
  view.x = (cx - r.left) - k * ((cx - r.left) - view.x);
  view.y = (cy - r.top) - k * ((cy - r.top) - view.y);
  view.z = z2;
  applyView();
}
function fitView() {
  const vp = $('viewport').getBoundingClientRect();
  const w = worldW();
  const h = +$('edgesvg').getAttribute('height') || 900;
  view.z = Math.min(1.15, Math.max(0.12, 0.94 * Math.min(vp.width / w, vp.height / h)));
  view.x = (vp.width - w * view.z) / 2;
  view.y = Math.max(12, (vp.height - h * view.z) / 2);
  applyView();
}
{
  const vp = $('viewport');
  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
    else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
  }, { passive: false });
  vp.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.card, .lanehead, #edgedel, path, button, input, textarea')) return;
    const sx = e.clientX, sy = e.clientY, ox = view.x, oy = view.y;
    let moved = false;
    vp.setPointerCapture(e.pointerId);
    vp.classList.add('panning');
    const mv = (e2) => {
      const dx = e2.clientX - sx, dy = e2.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      view.x = ox + dx; view.y = oy + dy; applyView();
    };
    const up2 = () => {
      vp.removeEventListener('pointermove', mv); vp.removeEventListener('pointerup', up2);
      vp.classList.remove('panning');
      if (!moved && (sel.size || selEdge)) clearSel();
    };
    vp.addEventListener('pointermove', mv);
    vp.addEventListener('pointerup', up2);
  });
}

/* ---------------- lane headers + drop rects (in-world) ---------------- */
function renderLanes(M, maxH) {
  const world = $('world');
  world.querySelectorAll('.lanehead, .lanebg').forEach((n) => n.remove());
  const top = M - maxH / 2;
  board.stages.forEach((s, i) => {
    const bg = document.createElement('div');
    bg.className = 'lanebg'; bg.dataset.stage = s.id;
    bg.style.left = (laneX(i) - 8) + 'px'; bg.style.width = (laneW(i) + 16) + 'px';
    bg.style.top = (top - 44) + 'px'; bg.style.height = (maxH + 88) + 'px';
    world.prepend(bg);
    const h = document.createElement('div');
    h.className = 'lanehead' + (s.center ? ' center' : '');
    h.style.left = laneX(i) + 'px'; h.style.top = (top - 46) + 'px'; h.style.width = laneW(i) + 'px';
    h.innerHTML = `<span class="t"></span><span class="n"></span>`;
    h.querySelector('.t').textContent = s.title;
    h.querySelector('.n').textContent = board.cards.filter((c) => c.stage === s.id).length;
    if (i > 0) {
      const add = document.createElement('button');
      add.className = 'add'; add.textContent = '＋'; add.title = 'Add card to ' + s.title;
      add.addEventListener('pointerdown', (e) => e.stopPropagation());
      add.addEventListener('click', () => { snapshot(); const c = addCard(s.id, null); render(); startTitleEdit(c.id); });
      h.appendChild(add);
    }
    world.appendChild(h);
  });
}

/* ---------------- mutations ---------------- */
function addCard(stage, y, title) {
  const c = { id: 'n' + (board.uid++), stage, title: title || 'Untitled', notes: '', y };
  board.cards.push(c); touch(); return c;
}
function delCard(id) {
  snapshot();
  board.cards = board.cards.filter((c) => c.id !== id);
  board.edges = board.edges.filter((e) => e.from !== id && e.to !== id);
  sel.delete(id); touch(); render();
}
function addEdge(from, to) {
  if (from === to) return;
  if (stageIdx(byId(from).stage) >= stageIdx(byId(to).stage)) return;
  if (board.edges.some((e) => e.from === from && e.to === to)) return;
  board.edges.push({ id: 'e' + (board.uid++), from, to }); touch();
}
function delEdge(id) { snapshot(); board.edges = board.edges.filter((e) => e.id !== id); if (selEdge === id) selEdge = null; touch(); render(); }
function setStatus(ids, st) {
  snapshot();
  ids.forEach((id) => { const c = byId(id); if (c && isSeed(c)) { if (st) c.status = st; else delete c.status; } });
  touch(); render();
}

/* ---------------- feature ranking (center lane) ---------------- */
const centerStage = () => board.stages.find((s) => s.center);
const centerCards = () => { const s = centerStage(); return s ? board.cards.filter((c) => c.stage === s.id) : []; };
function normalizeRanks() {
  const fs = centerCards();
  fs.sort((a, b) => ((a.rank ?? 1e9) - (b.rank ?? 1e9)) || ((a.y ?? 0) - (b.y ?? 0)));
  fs.forEach((c, i) => { if (c.rank !== i + 1) { c.rank = i + 1; dirty = true; } });
}
function bumpRank(id, d) {
  normalizeRanks();
  const fs = centerCards().sort((a, b) => a.rank - b.rank);
  const i = fs.findIndex((c) => c.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= fs.length) return;
  snapshot();
  const t = fs[i].rank; fs[i].rank = fs[j].rank; fs[j].rank = t;
  touch(); render();
}
function reRankFromY() {
  const fs = centerCards().sort((a, b) => (a.y ?? 0) - (b.y ?? 0));
  fs.forEach((c, i) => { c.rank = i + 1; });
}

/* ---------------- unified centered auto-layout ---------------- */
let lockedOrder = null, lockedGapKeys = null, sortMode = 'sort', clusterGroups = null;
let showDone = false;
function doReorder(mode) { sortMode = mode || 'sort'; lockedOrder = null; lockedGapKeys = null; render(); }
function laneOrders() {
  const S = board.stages;
  const cardsIn = (sid) => board.cards.filter((c) => c.stage === sid);
  const orders = {}, idxIn = {};
  const setOrder = (sid, arr) => { orders[sid] = arr; arr.forEach((c, i) => { idxIn[c.id] = i; }); };
  const inCount = (c) => board.edges.filter((e) => e.to === c.id).length;
  const upIdx = (c, sid) => {
    const ups = board.edges.filter((e) => e.to === c.id).map((e) => byId(e.from))
      .filter((u) => u && u.stage === sid && idxIn[u.id] != null);
    return ups.length ? ups.reduce((s, u) => s + idxIn[u.id], 0) / ups.length : 1e6;
  };
  // themes: most-connected first
  if (S[1] && !S[1].center) {
    const th = cardsIn(S[1].id);
    th.sort((a, b) => inCount(b) - inCount(a) || (a.y ?? 0) - (b.y ?? 0));
    setOrder(S[1].id, th);
  }
  // features: by rank
  const ctr = S.find((s) => s.center);
  if (ctr) setOrder(ctr.id, cardsIn(ctr.id).sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9)));
  // remaining lanes left→right: by mean upstream order
  for (let i = 2; i < S.length; i++) {
    const prevSid = S[i - 1].id;
    const cs = cardsIn(S[i].id);
    cs.sort((a, b) => upIdx(a, prevSid) - upIdx(b, prevSid) || (a.y ?? 0) - (b.y ?? 0));
    setOrder(S[i].id, cs);
  }
  // comments: untagged working pile on top, then tag bands basic → perf → delight → rnd → indiff;
  // within a band, grouped by first link target in target order
  const BAND = { basic: 1, perf: 2, delight: 3, rnd: 4, indiff: 5 };
  const seedSid = S[0].id;
  const cs = cardsIn(seedSid);
  const meta = new Map();
  for (const c of cs) {
    const ts = board.edges.filter((e) => e.from === c.id).map((e) => byId(e.to)).filter(Boolean)
      .sort((a, b) => (stageIdx(a.stage) - stageIdx(b.stage)) || ((idxIn[a.id] ?? 9e3) - (idxIn[b.id] ?? 9e3)));
    const t = ts[0];
    meta.set(c.id, {
      b: BAND[c.status] || 0,
      ti: t ? stageIdx(t.stage) * 1e4 + (idxIn[t.id] ?? 9e3) : 1e9,
      g: t ? t.id : '',
    });
  }
  cs.sort((a, b) => {
    const A = meta.get(a.id), B = meta.get(b.id);
    return A.b - B.b || A.ti - B.ti || (a.y ?? 0) - (b.y ?? 0);
  });
  setOrder(seedSid, cs);
  const freshKey = (c) => { const m = meta.get(c.id); return m ? m.b + '|' + m.g : ''; };

  // Cluster (c): re-group every lane by shared first tie to the next columns,
  // processed right-to-left so groups follow their target's position
  let clusterKeys = null;
  if (!lockedOrder && sortMode === 'cluster') {
    clusterGroups = new Map();
    for (let i = S.length - 1; i >= 0; i--) {
      const s = S[i];
      const lane = cardsIn(s.id);
      if (i === S.length - 1) {
        lane.sort((a, b) => (a.y ?? 0) - (b.y ?? 0));
        setOrder(s.id, lane);
        continue;
      }
      const key = new Map();
      for (const c of lane) {
        const ts = board.edges.filter((e) => e.from === c.id).map((e) => byId(e.to)).filter(Boolean)
          .sort((a, b) => (stageIdx(a.stage) - stageIdx(b.stage)) || ((idxIn[a.id] ?? 9e3) - (idxIn[b.id] ?? 9e3)));
        const t = ts[0];
        key.set(c.id, { k: t ? stageIdx(t.stage) * 1e4 + (idxIn[t.id] ?? 9e3) : 1e9, g: t ? t.id : '' });
      }
      // active suggestions act as provisional ties: pull each suggested comment
      // to sit right below its candidate's real group so the green line is short
      if (s.id === seedSid && suggestions) {
        for (const sg of suggestions) {
          const kv = key.get(sg.from);
          const t = byId(sg.to);
          if (kv && kv.k === 1e9 && t && idxIn[t.id] != null) {
            key.set(sg.from, { k: stageIdx(t.stage) * 1e4 + idxIn[t.id] + 0.5, g: '' });
          }
        }
      }
      const bandOf = (c) => BAND[c.status] || 0;
      lane.sort((a, b) => key.get(a.id).k - key.get(b.id).k || bandOf(a) - bandOf(b) || (a.y ?? 0) - (b.y ?? 0));
      setOrder(s.id, lane);
      for (const [id, v] of key) clusterGroups.set(id, v.g);
      if (s.id === seedSid) clusterKeys = key;
    }
  }

  // deferred sorting: keep the last committed order (new cards append at the end);
  // a fresh sort only happens after Sort (s) or Cluster (c) clears lockedOrder
  if (lockedOrder) {
    for (const s of S) {
      const cur = orders[s.id] || [];
      const inLane = new Map(cur.map((c) => [c.id, c]));
      const kept = (lockedOrder[s.id] || []).map((id) => inLane.get(id)).filter(Boolean);
      const seen = new Set(kept.map((c) => c.id));
      setOrder(s.id, kept.concat(cur.filter((c) => !seen.has(c.id))));
    }
  } else if (clusterKeys) {
    lockedGapKeys = new Map(cs.map((c) => [c.id, clusterKeys.get(c.id)?.g ?? '']));
  } else {
    clusterGroups = null;
    lockedGapKeys = new Map(cs.map((c) => [c.id, freshKey(c)]));
  }
  lockedOrder = Object.fromEntries(S.map((s) => [s.id, (orders[s.id] || []).map((c) => c.id)]));
  const gapKey = (c) => (lockedGapKeys && lockedGapKeys.get(c.id)) ?? freshKey(c);
  return { orders, gapsFor: (sid) => {
    if (sortMode === 'cluster' && clusterGroups) return (c) => clusterGroups.get(c.id) || '';
    return sid === seedSid ? gapKey : null;
  } };
}
function layoutBoard() {
  const { orders, gapsFor } = laneOrders();
  const seedSid = board.stages[0].id;
  const GG = sortMode === 'cluster' && clusterGroups ? 34 : 14; // inter-group gap

  // content heights of the single-column (non-seed) lanes
  const laneH = {};
  for (const s of board.stages) {
    if (s.id === seedSid) continue;
    const lgk = gapsFor(s.id);
    let h = 0, lk = null;
    for (const c of orders[s.id] || []) {
      const el = cardDom(c.id); if (!el || el.classList.contains('hidden')) continue;
      if (lgk) { const k = lgk(c); if (lk !== null && k !== lk) h += GG; lk = k; }
      h += el.offsetHeight + GAPY;
    }

    if (m && !prefOf.has(c.author)) prefOf.set(c.author, m[1]);
  }

const promptStage = () => centerStage() || board.stages[board.stages.length - 1];
let rec = null, recFinal = '', recOn = false;
let recField = null, recBase = '', recStart = 0, recEnd = 0;
function fieldInsert(field, text, moveCaret) {
  field.value = recBase.slice(0, recStart) + text + recBase.slice(recEnd);
  if (moveCaret !== false) {
    const p = recStart + text.length;
    try { field.setSelectionRange(p, p); } catch (err) {}
  }
  field.dispatchEvent(new Event('input', { bubbles: true }));
}
function startRec(field) {
  if (recOn || !board) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setSave('No speech API in this browser', true); return; }
  recOn = true; recFinal = '';
  recField = field || null;
  if (recField) {
    recBase = recField.value;
    recStart = recField.selectionStart ?? recBase.length;
    recEnd = recField.selectionEnd ?? recStart;
  }
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
  rec.onresult = (e) => {
    let f = '', interim = '';
    for (const r of e.results) { if (r.isFinal) f += r[0].transcript; else interim += r[0].transcript; }
    recFinal = f;
    const shown = (f + interim).trim();
    if (recField) fieldInsert(recField, shown); // live transcription at the caret
    $('rectext').textContent = shown ? '…' + shown.slice(-60) : 'listening…';
  };
  rec.onerror = () => {};
  $('rectext').textContent = 'listening…';
  $('recpill').classList.add('on');
  try { rec.start(); } catch (err) {}
}
function stopRec() {
  if (!recOn) return;
  recOn = false;
  $('recpill').classList.remove('on');
  const r = rec; rec = null;
  let done = false;
  const finish = () => { if (done) return; done = true; deliverRec(recFinal.trim()); };
  r.onend = finish;
  setTimeout(finish, 1500); // safety if onend never fires
  try { r.stop(); } catch (err) { finish(); }
}
/* voice = typing: finalize into the field being dictated into, else append to the selected card */
function deliverRec(text) {
  if (recField) {
    const f = recField; recField = null;
    fieldInsert(f, text ? text + ' ' : '');
    f.focus();
    return;
  }
  if (!text) return;
  const one = sel.size === 1 ? byId([...sel][0]) : null;
  if (!one || isSeed(one)) { setSave('Select a card first, then hold Space', true); return; }
  snapshot();
  one.notes = (one.notes ? one.notes.trim() + ' ' : '') + text;
  touch(); render();
}
/* push-to-talk: in a text field, a quick tap of Space types a space; holding it dictates live */
let spaceTimer = null, spaceField = null;
const dictField = (t) => (t.closest ? t.closest('textarea, input[type="text"], input[type="search"], input:not([type])') : null);
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  if (e.repeat) { if (spaceTimer || recOn) e.preventDefault(); return; }
  const field = dictField(e.target);
  if (field) {
    e.preventDefault();
    spaceField = field;
    spaceTimer = setTimeout(() => { spaceTimer = null; startRec(field); }, 250);
    return;
  }
  if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
  e.preventDefault(); startRec(null);
});
window.addEventListener('keyup', (e) => {
  if (e.code !== 'Space') return;
  if (spaceTimer) { // released before the hold threshold → it was a normal space
    clearTimeout(spaceTimer); spaceTimer = null;
    if (spaceField) {
      recBase = spaceField.value;
      recStart = spaceField.selectionStart ?? recBase.length;
      recEnd = spaceField.selectionEnd ?? recStart;
      fieldInsert(spaceField, ' ');
    }
    spaceField = null;
    e.preventDefault();
    return;
  }
  spaceField = null;
  if (!recOn) return;
  e.preventDefault(); stopRec();
});

/* ---------------- execute sprint ---------------- */
$('execBtn').addEventListener('click', async () => {
  const ps = promptStage();
  const n = board.cards.filter((c) => c.stage === ps.id && !c.done &&
    (((c.notes || '').trim()) || (c.title && c.title !== 'Untitled'))).length;
  if (!n) { setSave('No prompts to run', true); return; }
  if (!confirm(`Execute sprint: hand ${n} prompt${n === 1 ? '' : 's'} to implementation agents?`)) return;
  await saveNow();
  try {
    const j = await (await fetch('/api/execute', { method: 'POST' })).json();
    if (j.queued) setSave(`Sprint queued (${j.queued})`);
    else setSave(j.error || 'Queue failed', true);
  } catch (err) { setSave('Server offline', true); }
});

/* ---------------- live sprint-agent monitor ---------------- */
async function pollSprint() {
  let j;
  try { j = await (await fetch('/api/sprint')).json(); } catch (e) { return; }
  const box = $('sprintmon');
  if (!j.queue || !j.agents || !j.agents.length) { box.classList.remove('on'); return; }
  const doneN = j.agents.filter((a) => a.report).length;
  const allDone = doneN === j.agents.length;
  $('smstate').textContent = allDone
    ? `all ${j.agents.length} done — click a row for the report`
    : `${doneN}/${j.agents.length} done · ${j.queue.status}`;
  const rows = $('smrows'); rows.innerHTML = '';
  for (const a of j.agents) {
    const row = document.createElement('div');
    const ageMin = a.lastMs ? (Date.now() - a.lastMs) / 60000 : null;
    row.className = 'smrow' + (a.report ? ' done' : (ageMin !== null && ageMin > 12 ? ' stale' : ''));
    const last = a.report ? 'Report ready — click to read' :
      (a.lines.length ? a.lines[a.lines.length - 1] : 'starting…');
    const ago = a.report ? '✓' : (ageMin === null ? '' : ageMin < 1 ? 'now' : Math.round(ageMin) + 'm');
    row.innerHTML = `<div class="t"><span class="dot"></span><span class="ti"></span><span class="ago">${ago}</span></div><div class="last"></div>`;
    row.querySelector('.ti').textContent = `P${a.rank} · ${a.title}`;
    row.querySelector('.last').textContent = last;
    if (a.report) row.addEventListener('click', async () => {
      try {
        $('exportText').value = await (await fetch('/api/result?p=' + a.nn)).text();
        $('copyNote').textContent = '';
        $('overlay').classList.add('open');
      } catch (e) {}
    });
    rows.appendChild(row);
  }
  box.classList.add('on');
}
setInterval(pollSprint, 3000);

loadState();
refreshInbox();
pollSprint();
</script>
